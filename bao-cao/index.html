 let h=sec(1,'TỔNG QUAN KH ON',bx('',`<div class="kcs">${card('Quầy ON trong MCP',vi(base.length),'Kênh Off-trade → ON','c1')}${card('Đã mua tháng này',vi(b),pc(b/Math.max(base.length,1))+' MCP ON · mốc '+pc(.8*PACE),'c2')}${card('Chưa mua',vi(base.length-b),'','c4')}${card('Đơn Combo ON',vi(cb.length),vi(new Set(cb.map(c=>c.code)).size)+' quầy','c3')}</div>`+tbl(th([['ĐDKD'],['MCP ON'],['Đã mua'],['%'],['Còn thiếu mốc 80%'],['Combo ON (đơn)']]),[...rs].sort((a,b)=>(a.mcpActiveOn/(a.mcpOn||1))-(b.mcpActiveOn/(b.mcpOn||1))).map(r=>{const x=r.mcpActiveOn/(r.mcpOn||1);return `<tr>${td(E(r.rep),'l')}${td(vi(r.mcpOn))}${td(vi(r.mcpActiveOn))}${td(pc(x,0),x>=.8*PACE?'ok':'no')}${td(vi(Math.max(Math.ceil(.8*PACE*r.mcpOn-r.mcpActiveOn),0)))}${td(vi(cb.filter(c=>c.ddkd===r.rep).length))}</tr>`}).join(''),'')),'');
 h+=sec(2,'DANH SÁCH QUẦY ON',bx('',cfilter('ON')+custTable(all,true)),'');
 return h};
/* ------------- Cài đặt ------------- */
T.set=function(){return sec(1,'THÔNG TIN DỮ LIỆU',bx('Nguồn và cách cập nhật',`<ul class="nt2"><li>Phạm vi: <b>${E(M.teamLabel)}</b> · ${E(M.npp)} · ${D.reps.length} ĐDKD.</li><li>Dữ liệu đến <b>${E(M.updated)}</b> (${EL}/${WK} ngày làm việc, tiến độ ${pc(PACE)}).</li><li>Doanh số = Thành tiền trước chiết khấu, bỏ đơn đã hủy và NVBH vãng lai. Số đơn/line không tính hàng KM.</li><li>Chỉ tiêu, ASO, MCP, thưởng lấy từ file KPI THÁNG; số đơn/doanh số ngày từ file đơn hàng; khách hàng từ MCP.</li><li>Kênh OFF/ON và nhóm khách hàng lấy theo MCP; quầy không có trong MCP tính vào OFF – Lẻ.</li><li>Chưa có dữ liệu "MOQ = Y" và số call thực tế nên số call được tính theo tần suất ghé MCP × tiến độ ngày công.</li><li>Cập nhật: Anh gửi file Tracking KPI mới, em nạp lại và đẩy lên link này.</li></ul>`)+bx('Giao diện',`<button class="btn" id="tg">Đổi giao diện Sáng / Tối</button>`),'')};
})();

(function(){
const {D,M,E,$,ST,R,vi,pc}=window.RPK,T=window.RPT;
const TABS=[['db','DASHBOARD','Báo cáo kinh doanh tháng',true],['tq','TỔNG QUAN','Tổng quan tháng',true],['fun','FUNDAMENTAL','Fundamental',true],['th','THƯỞNG','Thưởng ĐDKD',true],['cust','KHÁCH HÀNG','Khách hàng',false],['on','KH ON','Khách hàng kênh ON',false],['set','CÀI ĐẶT','Cài đặt',false]];
function render(){
 const t=TABS.find(x=>x[0]===ST.tab),m=M.period.slice(5);
 $('#nav').innerHTML=TABS.map(x=>`<button data-t="${x[0]}" class="${x[0]===ST.tab?'on':''}">${x[1]}</button>`).join('');
 const flt=t[3]?`<div class="lf"><span>Lọc:</span><button data-s="all" class="${ST.scope==='all'?'on':''}">Tổng Team</button><select id="sc"><option value="all">— Chọn ĐDKD (${D.reps.length}) —</option>${[...D.reps].sort((a,b)=>a.rep.localeCompare(b.rep,'vi')).map(r=>`<option ${ST.scope===r.rep?'selected':''}>${E(r.rep)}</option>`).join('')}</select><em>Đang xem: ${ST.scope==='all'?'Toàn Team':E(ST.scope)}</em></div>`:'';
 $('#main').innerHTML=`<div class="ph"><h1>${t[2]} – Tháng ${+m}/2026</h1><p>Đơn hàng đến ${E(M.updated)} · ${E(M.teamLabel)} · ${M.elapsed}/${M.working} ngày làm việc · tiến độ ${pc(M.elapsed/M.working)}</p></div>${flt}${T[ST.tab]()}`;
 $('#sub').textContent=`${E(M.npp)} · cập nhật ${E(M.updated)}`;
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{ST.tab=b.dataset.t;ST.cp=0;render();scrollTo(0,0)});
 document.querySelectorAll('.lf button').forEach(b=>b.onclick=()=>{ST.scope='all';render()});
 const sc=$('#sc');if(sc)sc.onchange=()=>{ST.scope=sc.value;render()};
 const cq=$('#cq');if(cq){cq.oninput=()=>{ST.q=cq.value;ST.cp=0;clearTimeout(cq._t);cq._t=setTimeout(()=>{render();const n=$('#cq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)}};
 ['cs','ct'].forEach(i=>{const e=$('#'+i);if(e)e.onchange=()=>{ST[i]=e.value;ST.cp=0;render()}});
 document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{ST.cp=Math.max(ST.cp+ +b.dataset.pg,0);render()});
 const tg=$('#tg');if(tg)tg.onclick=()=>{document.documentElement.classList.toggle('dk')};
}
render();
})();
